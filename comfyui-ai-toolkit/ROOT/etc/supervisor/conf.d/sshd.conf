# Runs our own sshd: entrypoint/args launch mode does not get VastAI's injected
# sshd. Always auto-starts and does NOT wait on Portal/provisioning, so the
# instance is reachable over SSH for debugging while it boots.
[program:sshd]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/sshd.sh
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=10
# Must output to /dev/stdout for Vast logging
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_events_enabled=true
stdout_logfile_maxbytes=0
stdout_logfile_backups=0
